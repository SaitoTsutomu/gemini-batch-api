[project]
authors = [{name = "Saito Tsutomu", email = "tsutomu7@hotmail.co.jp"}]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "google-genai>=1.63.0",
]
description = "Gemini Batch API utility"
license = {text = "Apache-2.0"}
name = "gemini-batch-api"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.3"

[dependency-groups]
dev = [
  "fire>=0.7.1",
  "jupyter>=1.1.1",
  "pytest>=9.0.2",
]

[project.urls]
homepage = "https://github.com/SaitoTsutomu/gemini-batch-api"

[tool.taskipy.tasks]
jupyter = "uv run --env-file .env jupyter lab -y nbs"
lint = "pyrefly check && ruff check "
run = "uv run --env-file .env"
test = "uv run pytest --disable-warnings"

[tool.uv]
exclude-newer = "3 days"

[[tool.uv.index]]
default = true
url = "https://pypi.flatt.tech/simple/"

[tool.pyrefly]
project-excludes = ["src/tests/**"]
project-includes = ["src", "sample"]

[tool.ruff]
src = ["src", "sample"]

[tool.ruff.lint]
ignore = [
  "missing-trailing-comma", # https://docs.astral.sh/ruff/rules/missing-trailing-comma/
  "CPY", # https://docs.astral.sh/ruff/rules/#flake8-copyright-cpy
  "D10", # https://docs.astral.sh/ruff/rules/#pydocstyle-d
  "incorrect-blank-line-before-class", # https://docs.astral.sh/ruff/rules/incorrect-blank-line-before-class/
  "multi-line-summary-second-line", # https://docs.astral.sh/ruff/rules/multi-line-summary-second-line/
  "missing-trailing-period", # https://docs.astral.sh/ruff/rules/missing-trailing-period/
  "non-imperative-mood", # https://docs.astral.sh/ruff/rules/non-imperative-mood/
  "missing-terminal-punctuation", # https://docs.astral.sh/ruff/rules/missing-terminal-punctuation/
  "docstring-missing-returns", # https://docs.astral.sh/ruff/rules/docstring-missing-returns/
  "docstring-missing-yields", # https://docs.astral.sh/ruff/rules/docstring-missing-yields/
  "docstring-missing-exception", # https://docs.astral.sh/ruff/rules/docstring-missing-exception/
  "DTZ", # https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
  "line-too-long", # https://docs.astral.sh/ruff/rules/line-too-long/
  "lambda-assignment", # https://docs.astral.sh/ruff/rules/lambda-assignment/
]
preview = true
select = ["ALL"]

[tool.ruff.lint.pylint]
max-nested-blocks = 6

[tool.ruff.lint.extend-per-file-ignores]
"*/tests/*.py" = ["assert"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.26,<0.10.0"]
